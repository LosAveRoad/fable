apiVersion: v1
kind: Service
metadata: {name: kafka, namespace: fable}
spec:
  selector: {app: kafka}
  ports:
    - {name: kafka, port: 9092, targetPort: kafka}
    - {name: controller, port: 9093, targetPort: controller}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: kafka, namespace: fable}
spec:
  serviceName: kafka
  replicas: 1
  selector: {matchLabels: {app: kafka}}
  template:
    metadata: {labels: {app: kafka}}
    spec:
      securityContext: {fsGroup: 1001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: kafka
          image: bitnamilegacy/kafka:3.9.0
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          env:
            - {name: KAFKA_CFG_NODE_ID, value: "1"}
            - {name: KAFKA_CFG_PROCESS_ROLES, value: "broker,controller"}
            - {name: KAFKA_CFG_CONTROLLER_QUORUM_VOTERS, value: "1@kafka-0.kafka.fable.svc.cluster.local:9093"}
            - {name: KAFKA_CFG_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093"}
            - {name: KAFKA_CFG_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:9092"}
            - {name: KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"}
            - {name: KAFKA_CFG_CONTROLLER_LISTENER_NAMES, value: CONTROLLER}
            - {name: KAFKA_CFG_INTER_BROKER_LISTENER_NAME, value: PLAINTEXT}
            - {name: KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE, value: "false"}
            - {name: KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR, value: "1"}
            - {name: KAFKA_HEAP_OPTS, value: "-Xms256m -Xmx512m"}
            - {name: ALLOW_PLAINTEXT_LISTENER, value: "yes"}
          ports:
            - {name: kafka, containerPort: 9092}
            - {name: controller, containerPort: 9093}
          readinessProbe: {tcpSocket: {port: kafka}, initialDelaySeconds: 10, periodSeconds: 10}
          livenessProbe: {tcpSocket: {port: kafka}, initialDelaySeconds: 30, periodSeconds: 10}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts: [{name: data, mountPath: /bitnami/kafka}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 20Gi}}
---
apiVersion: batch/v1
kind: Job
metadata: {name: kafka-init-topic, namespace: fable}
spec:
  backoffLimit: 10
  template:
    metadata: {labels: {app: kafka-init}}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: kafka-init
          image: bitnamilegacy/kafka:3.9.0
          command: ["/bin/bash", "-ec"]
          args:
            - |
              kafka-topics.sh --bootstrap-server kafka:9092 \
                --create --if-not-exists \
                --topic fable.chat.message --partitions 6 --replication-factor 1
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 200m, memory: 256Mi}
