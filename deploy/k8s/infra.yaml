apiVersion: apps/v1
kind: Deployment
metadata: {name: redis, namespace: fable}
spec:
  replicas: 1
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis}}
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          args: ["redis-server", "--appendonly", "yes", "--requirepass", "$(REDIS_PASSWORD)"]
          env: [{name: REDIS_PASSWORD, valueFrom: {secretKeyRef: {name: fable-secret, key: FABLE_REDIS_PASSWORD}}}]
          ports: [{containerPort: 6379}]
          volumeMounts: [{name: data, mountPath: /data}]
      volumes: [{name: data, persistentVolumeClaim: {claimName: redis-data}}]
---
apiVersion: v1
kind: Service
metadata: {name: redis, namespace: fable}
spec:
  selector: {app: redis}
  ports: [{port: 6379, targetPort: 6379}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: redis-data, namespace: fable}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 5Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: kafka, namespace: fable}
spec:
  replicas: 1
  selector: {matchLabels: {app: kafka}}
  template:
    metadata: {labels: {app: kafka}}
    spec:
      containers:
        - name: kafka
          image: bitnamilegacy/kafka:3.9.0
          env:
            - {name: KAFKA_CFG_NODE_ID, value: "1"}
            - {name: KAFKA_CFG_PROCESS_ROLES, value: broker,controller}
            - {name: KAFKA_CFG_CONTROLLER_QUORUM_VOTERS, value: 1@kafka:9093}
            - {name: KAFKA_CFG_LISTENERS, value: PLAINTEXT://:9092,CONTROLLER://:9093}
            - {name: KAFKA_CFG_ADVERTISED_LISTENERS, value: PLAINTEXT://kafka:9092}
            - {name: KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP, value: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT}
            - {name: KAFKA_CFG_CONTROLLER_LISTENER_NAMES, value: CONTROLLER}
            - {name: KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE, value: "false"}
            - {name: KAFKA_CFG_NUM_PARTITIONS, value: "6"}
            - {name: ALLOW_PLAINTEXT_LISTENER, value: "yes"}
          ports: [{containerPort: 9092}]
          volumeMounts: [{name: data, mountPath: /bitnami/kafka}]
      volumes: [{name: data, persistentVolumeClaim: {claimName: kafka-data}}]
---
apiVersion: v1
kind: Service
metadata: {name: kafka, namespace: fable}
spec:
  selector: {app: kafka}
  ports: [{port: 9092, targetPort: 9092}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: kafka-data, namespace: fable}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 20Gi}}
