apiVersion: apps/v1
kind: Deployment
metadata:
  name: fable
  namespace: fable
spec:
  replicas: 2
  selector:
    matchLabels: {app: fable}
  template:
    metadata: {labels: {app: fable}}
    spec:
      containers:
        - name: fable
          image: ghcr.io/OWNER/fable:latest
          ports: [{name: http, containerPort: 8080}]
          envFrom: [{secretRef: {name: fable-secret}}]
          env:
            - {name: FABLE_MYSQL_HOST, value: "116.62.153.14"}
            - {name: FABLE_MYSQL_PORT, value: "3307"}
            - {name: FABLE_REDIS_HOST, value: "116.62.153.14"}
            - {name: FABLE_REDIS_ENABLED, value: "true"}
            - {name: FABLE_REDIS_REQUIRED, value: "true"}
            - {name: FABLE_KAFKA_ENABLED, value: "true"}
            - {name: FABLE_KAFKA_REQUIRED, value: "true"}
            - {name: FABLE_KAFKA_MODE, value: "kafka"}
            - {name: FABLE_KAFKA_BROKERS, value: "kafka:9092"}
          readinessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 15}
---
apiVersion: v1
kind: Service
metadata:
  name: fable
  namespace: fable
spec:
  selector: {app: fable}
  ports: [{name: http, port: 8080, targetPort: http}]
