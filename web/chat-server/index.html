<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MyChat MVP0</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="auth-page" class="card">
    <h1>MyChat</h1>
    <form id="auth-form">
      <input id="nickname" placeholder="Nickname (registration only)" hidden>
      <input id="telephone" placeholder="Telephone" required>
      <input id="password" type="password" placeholder="Password" required>
      <button id="auth-submit" type="submit">Login</button>
    </form>
    <button id="toggle-auth" class="link" type="button">Need an account? Register</button>
    <p id="auth-message" class="message"></p>
  </section>

  <main id="chat-page" hidden>
    <aside>
      <div class="bar"><strong id="my-name">Not logged in</strong><button id="logout" type="button">Logout</button></div>
      <button id="refresh-sessions" type="button">Refresh sessions</button>
      <div id="sessions"></div>
      <form id="open-session-form">
        <input id="target-uuid" placeholder="Peer UUID, e.g. U001" required>
        <button type="submit">Open chat</button>
      </form>
    </aside>

    <section class="chat">
      <div class="bar"><strong id="chat-title">Select a session</strong><span id="connection">Not connected</span></div>
      <div id="messages"></div>
      <form id="message-form">
        <input id="message-input" placeholder="Type a message" autocomplete="off" disabled>
        <button type="submit" disabled>Send</button>
      </form>
      <p id="chat-message" class="message"></p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
