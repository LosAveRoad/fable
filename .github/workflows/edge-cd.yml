name: Edge CD

on:
  push:
    branches: [main]
    paths:
      - 'deploy/host2/**'
      - 'deploy/k8s/app-external.yaml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload edge configuration
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          source: 'deploy/host2/*'
          target: /tmp/fable-edge
          strip_components: 2
          overwrite: true
      - name: Configure Nginx and K3s edge
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          command_timeout: 15m
          script: |
            kubectl -n fable patch service fable --type merge -p '{"spec":{"type":"NodePort","ports":[{"name":"http","port":8080,"protocol":"TCP","targetPort":"http","nodePort":30080}]}}'
            chmod 0755 /tmp/fable-edge/bootstrap-edge.sh
            /tmp/fable-edge/bootstrap-edge.sh
            curl --fail --silent --show-error https://api.fableim.lol/healthz
