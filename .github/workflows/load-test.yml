name: Load test (manual)

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: k6 scenario file
        required: true
        default: healthz
        type: choice
        options: [healthz, business, websocket]
      target_rps:
        description: Target requests/sec (ignored for websocket)
        required: true
        default: '100'
      duration:
        description: Test duration, for example 30s or 5m
        required: true
        default: 30s
      ws_vus:
        description: Concurrent WebSocket users (websocket only)
        required: true
        default: '100'
      target_ip:
        description: VPS2 public IP
        required: true
        default: 38.147.170.246

permissions:
  contents: read

jobs:
  load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_HOST: api.fableim.lol
      TARGET_IP: ${{ inputs.target_ip }}
      SCENARIO: ${{ inputs.scenario }}
      TARGET_RPS: ${{ inputs.target_rps }}
      DURATION: ${{ inputs.duration }}
      WS_VUS: ${{ inputs.ws_vus }}
      AUTH_TOKEN: ${{ secrets.LOAD_TEST_AUTH_TOKEN }}
      GROUP_ID: ${{ vars.LOAD_TEST_GROUP_ID }}
      WS_TOKEN: ${{ secrets.LOAD_TEST_WS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Run k6 with fixed target IP
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          docker run --rm \
            --add-host "${TARGET_HOST}:${TARGET_IP}" \
            -e BASE_URL="https://${TARGET_HOST}" \
            -e TARGET_RPS -e DURATION -e AUTH_TOKEN -e GROUP_ID \
            -e WS_BASE="wss://${TARGET_HOST}" -e WS_VUS -e WS_TOKEN \
            -v "$PWD:/work" -w /work grafana/k6 run \
            --summary-export="/work/artifacts/summary.json" \
            "tests/load/${SCENARIO}.js" | tee artifacts/k6.log

      - name: Upload load-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fable-load-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
