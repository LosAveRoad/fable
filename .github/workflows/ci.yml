name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: mychat-dev-password
          MYSQL_DATABASE: mychat_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pmychat-dev-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      TEST_MYSQL_HOST: 127.0.0.1
      TEST_MYSQL_USER: root
      TEST_MYSQL_PASSWORD: mychat-dev-password
      TEST_MYSQL_DATABASE: mychat_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Check formatting
        shell: bash
        run: |
          files=$(gofmt -l internal/integration internal/service/chatservice)
          if [ -n "$files" ]; then
            echo "These files are not formatted:"
            echo "$files"
            exit 1
          fi

      - name: Run unit tests
        run: go test ./...

      - name: Run integration tests
        run: go test -tags=integration -count=1 -v ./internal/integration
