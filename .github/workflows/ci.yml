name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: mychat-dev-password
          MYSQL_DATABASE: mychat_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pmychat-dev-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=12

      kafka:
        image: bitnamilegacy/kafka:3.9.0
        env:
          KAFKA_CFG_NODE_ID: "1"
          KAFKA_CFG_PROCESS_ROLES: broker,controller
          KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
          KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "false"
          KAFKA_CFG_NUM_PARTITIONS: "6"
          KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
          KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
          KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: "1"
          KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
        ports:
          - 9092:9092
        options: >-
          --health-cmd="/opt/bitnami/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval=10s
          --health-timeout=10s
          --health-retries=18

    env:
      FABLE_LOGIC_TEST_MYSQL_DSN: "root:mychat-dev-password@tcp(127.0.0.1:3306)/?charset=utf8mb4&parseTime=true&loc=UTC"
      FABLE_LOGIC_TEST_REDIS_ADDR: 127.0.0.1:6379
      FABLE_LOGIC_TEST_KAFKA_BROKER: 127.0.0.1:9092
      TEST_MYSQL_HOST: 127.0.0.1
      TEST_MYSQL_USER: root
      TEST_MYSQL_PASSWORD: mychat-dev-password
      TEST_MYSQL_DATABASE: mychat_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install pinned protoc
        shell: bash
        run: |
          protoc_dir="$RUNNER_TEMP/protoc-33.4"
          mkdir -p "$protoc_dir"
          curl --fail --show-error --silent --location --retry 3 \
            https://github.com/protocolbuffers/protobuf/releases/download/v33.4/protoc-33.4-linux-x86_64.zip \
            --output "$protoc_dir/protoc.zip"
          echo "c0040ea9aef08fdeb2c74ca609b18d5fdbfc44ea0042fcfbfb38860d35f7dd66  $protoc_dir/protoc.zip" | sha256sum --check --strict
          unzip -q "$protoc_dir/protoc.zip" -d "$protoc_dir"
          echo "$protoc_dir/bin" >> "$GITHUB_PATH"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/chat-server/package-lock.json

      - name: Download dependencies
        run: go mod download

      - name: Check formatting
        shell: bash
        run: |
          files=$(git ls-files "internal/integration/*.go" "internal/service/chatservice/*.go" "internal/comet/*.go" "internal/comet/**/*.go" "internal/job/*.go" "internal/job/**/*.go" "internal/logic/*.go" "internal/logic/**/*.go" "internal/localdev/*.go" "internal/e2e/*.go" "internal/blackbox/*.go" "internal/httpdocs/*.go" "internal/https_server/*.go" "internal/mcpserver/*.go" "internal/mcpserver/**/*.go" "cmd/**/*.go" "api/gen/**/*.go" | xargs gofmt -l)
          if [ -n "$files" ]; then
            echo "These files are not formatted:"
            echo "$files"
            exit 1
          fi

      - name: Check pinned Protobuf generated bindings
        run: sh scripts/generate-proto.sh --check

      - name: Check HTTP generated contract
        run: sh scripts/check-httpdocs.sh

      - name: Run unit tests
        run: go test -p 1 ./...

      - name: Vet Go packages
        run: go vet -p 1 ./...

      - name: Check Comet and Job concurrency
        run: go test -p 1 -race ./internal/comet/... ./internal/job/...

      - name: Check local ingress and lifecycle
        run: |
          node --test deploy/local/proxy.test.mjs
          python3 -m unittest discover -s scripts/local -p 'test_*.py'
          FABLE_LOCAL_MYSQL_PASSWORD=compose-validation-only docker compose -f deploy/local/infra.yml config --quiet

      - name: Verify browser state and production build
        working-directory: web/chat-server
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build

      - name: Run integration tests
        run: go test -tags=integration -count=1 -v ./internal/integration

      - name: Verify real backend boundaries
        run: go test -p 1 -race -tags='integration mysql' -count=1 -timeout=180s ./internal/logic/... ./internal/job/... ./internal/localdev

      - name: Verify two Logic two Comet two Job topology
        env:
          FABLE_E2E_ARTIFACT_DIR: ${{ runner.temp }}/fable-e2e-logs
        run: ./scripts/smoke.sh -timeout=240s

      - name: Verify managed Compose startup and selected deployment smoke
        env:
          FABLE_LOCAL_RUNTIME_DIR: ${{ runner.temp }}/fable-managed
          FABLE_LOCAL_PORT_BASE: "20080"
        run: |
          ./scripts/dev-up.sh --skip-web
          ./scripts/dev-status.sh
          python3 scripts/local/manage.py smoke
          ./scripts/dev-up.sh --skip-web

      - name: Verify public black-box flows
        run: |
          go run ./cmd/blackbox -base-url http://127.0.0.1:20080 \
            -run-id "$(python3 -c 'import uuid; print(uuid.uuid4())')" \
            -report "$RUNNER_TEMP/fable-blackbox-report.json"

      - name: Measure bounded public message load
        run: |
          go run ./cmd/bench -base-url http://127.0.0.1:20080 \
            -run-id "$(python3 -c 'import uuid; print(uuid.uuid4())')" \
            -report "$RUNNER_TEMP/fable-bench-report.json" \
            -pairs 2 -rate 2 -duration 10s -receive-timeout 5s -min-receive-ratio 1

      - name: Stop managed local topology
        if: always()
        env:
          FABLE_LOCAL_RUNTIME_DIR: ${{ runner.temp }}/fable-managed
        run: ./scripts/dev-down.sh --infra

      - name: Preserve public reports and sanitized role diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fable-validation
          path: |
            ${{ runner.temp }}/fable-blackbox-report.json
            ${{ runner.temp }}/fable-bench-report.json
            ${{ runner.temp }}/fable-managed/logic-*.log
            ${{ runner.temp }}/fable-managed/comet-*.log
            ${{ runner.temp }}/fable-managed/job-*.log
            ${{ runner.temp }}/fable-e2e-logs/**/logic-*.log
            ${{ runner.temp }}/fable-e2e-logs/**/comet-*.log
            ${{ runner.temp }}/fable-e2e-logs/**/job-*.log
          if-no-files-found: ignore
          retention-days: 7
