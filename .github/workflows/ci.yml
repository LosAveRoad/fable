name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: mychat-dev-password
          MYSQL_DATABASE: mychat_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pmychat-dev-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=12

      kafka:
        image: bitnamilegacy/kafka:3.9.0
        env:
          KAFKA_CFG_NODE_ID: "1"
          KAFKA_CFG_PROCESS_ROLES: broker,controller
          KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
          KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "false"
          KAFKA_CFG_NUM_PARTITIONS: "6"
          KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
          KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
          KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: "1"
          KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
        ports:
          - 9092:9092
        options: >-
          --health-cmd="/opt/bitnami/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval=10s
          --health-timeout=10s
          --health-retries=18

    env:
      FABLE_LOGIC_TEST_MYSQL_DSN: "root:mychat-dev-password@tcp(127.0.0.1:3306)/?charset=utf8mb4&parseTime=true&loc=UTC"
      FABLE_LOGIC_TEST_REDIS_ADDR: 127.0.0.1:6379
      FABLE_LOGIC_TEST_KAFKA_BROKER: 127.0.0.1:9092
      TEST_MYSQL_HOST: 127.0.0.1
      TEST_MYSQL_USER: root
      TEST_MYSQL_PASSWORD: mychat-dev-password
      TEST_MYSQL_DATABASE: mychat_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Check formatting
        shell: bash
        run: |
          files=$(git ls-files "internal/integration/*.go" "internal/service/chatservice/*.go" "internal/comet/*.go" "internal/job/*.go" "internal/logic/*.go" "internal/logic/**/*.go" "internal/httpdocs/*.go" "internal/https_server/*.go" "internal/mcpserver/*.go" "internal/mcpserver/**/*.go" "cmd/logic/*.go" "cmd/httpdocs/*.go" "api/gen/**/*.go" | xargs gofmt -l)
          if [ -n "$files" ]; then
            echo "These files are not formatted:"
            echo "$files"
            exit 1
          fi

      - name: Check HTTP generated contract
        run: sh scripts/check-httpdocs.sh

      - name: Run unit tests
        run: go test ./...

      - name: Check Comet and Job concurrency
        run: go test -race ./internal/comet ./internal/job

      - name: Run integration tests
        run: go test -tags=integration -count=1 -v ./internal/integration

      - name: Verify Logic with real MySQL Redis and Kafka
        run: go test -p 1 -race -tags='integration mysql' -count=1 ./internal/logic/...
